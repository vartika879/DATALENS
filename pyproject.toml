[project]
name = "datalens"
dynamic = ["version"] 
description = "Agentic AI for natural-language data analysis on CSV files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "groq>=0.11.0",
    "streamlit>=1.38.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "structlog>=24.4.0"]
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends()/File() as argument defaults by design.
"src/datalens/api/**/*.py" = ["B008"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (require real LLM calls; run with -m slow)",
]

[tool.hatch.version]
path = "src/datalens/__init__.py" 