[project]
name = "datalens"
dynamic = ["version"] 
description = "Agentic AI for natural-language data analysis on CSV files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "groq>=0.11.0",]
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.hatch.version]
path = "src/datalens/__init__.py" 