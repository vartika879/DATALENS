services:
  test:
    build: .
    command: /app/.venv/bin/pytest -v

  lint:
    build: .
    command: sh -c "/app/.venv/bin/ruff check . && /app/.venv/bin/ruff format . --check"

  ui:
    build: .
    command: /app/.venv/bin/streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env

  api:
    build: .
    command: /app/.venv/bin/uvicorn datalens.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
